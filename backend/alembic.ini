[alembic]
# имя файла новой миграции = её revision: ГГГГММДД_тема (--rev-id), см. CLAUDE.md «Параллельные сессии»
file_template = %%(rev)s
script_location = alembic
prepend_sys_path = .

[loggers]
keys = root,alembic
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARN
handlers = console
[logger_alembic]
level = INFO
handlers =
qualname = alembic
[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
