server {
  listen 80;
  client_max_body_size 21m;  # загрузка XLSX-отчётов (REPORT_MAX_SIZE_MB = 20); по умолчанию nginx режет на 1 МБ
  location /api/v1/ { proxy_pass http://api:8000/api/v1/; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; }
  location /health { proxy_pass http://api:8000/health; }
  location / { proxy_pass http://frontend:3000; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; }
}
