# Nginx прод-сборки (шаг 8.4). Сайт — templates/default.conf.template (домен из DOMAIN в .env.prod).
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  log_format main '$remote_addr - [$time_local] "$request" $status $body_bytes_sent $request_time "$http_user_agent"';
  access_log /var/log/nginx/access.log main;  # в образе — вывод контейнера, ротация — настройками Docker

  sendfile on;
  keepalive_timeout 65;
  server_tokens off;  # без версии Nginx в ответах

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_min_length 1024;
  gzip_comp_level 5;
  gzip_types text/plain text/css text/xml application/json application/javascript application/xml image/svg+xml;

  # Вход: не больше 10 запросов в минуту с одного IP (подбор пароля упирается ещё и в лимит бэкенда)
  limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
  limit_req_status 429;

  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  include /etc/nginx/conf.d/*.conf;
}
