# Прод-сборка (шаг 8.4). Первый запуск — scripts/setup.sh, обновление — scripts/deploy.sh, остальные команды —
# через scripts/compose.sh (подставляет .env.prod и версию). Пошагово — README-DEPLOY.md.
# Наружу открыты только 80 и 443 (Nginx); БД, Redis, API и сервер Next — во внутренней сети Docker.
name: ozon-analytics

x-logging: &logging
  # журналы контейнеров с ротацией: до 5 файлов по 10 МБ на сервис
  driver: json-file
  options: { max-size: "10m", max-file: "5" }

x-backend: &backend
  # один образ на API, воркер, расписание, бота и команды администратора; версия — коммит (scripts/deploy.sh)
  image: ozon-analytics/backend:${APP_VERSION:-latest}
  restart: unless-stopped
  env_file: .env.prod
  environment:
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    REDIS_URL: redis://redis:6379/0
    ENVIRONMENT: production
    APP_VERSION: ${APP_VERSION:-latest}
  depends_on:
    db: { condition: service_healthy }
    redis: { condition: service_healthy }
  logging: *logging

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    shm_size: 128mb
    mem_limit: 1g
    logging: *logging

  redis:
    # очередь Celery, отозванные токены, счётчики попыток входа; сохраняется на диск — после перезапуска отозванные
    # токены остаются отозванными
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 200mb --maxmemory-policy noeviction
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 256m
    logging: *logging

  api:
    <<: *backend
    build:
      context: ./backend
      dockerfile: ../docker/backend/Dockerfile.prod
      args: { APP_VERSION: "${APP_VERSION:-latest}" }
    # миграции — отдельным шагом scripts/deploy.sh (до перезапуска, с откатом), не при старте контейнера
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2 --no-server-header --timeout-graceful-shutdown 20
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    mem_limit: 1g

  worker:
    <<: *backend
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=2 --max-tasks-per-child=200
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.tasks.celery_app inspect ping -d celery@$$HOSTNAME --timeout 10 >/dev/null"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 60s
    stop_grace_period: 60s  # дать закончить начатую синхронизацию
    mem_limit: 1536m

  beat:
    # расписание фоновых задач; ровно один экземпляр
    <<: *backend
    command: celery -A app.tasks.celery_app beat --loglevel=info --schedule /tmp/celerybeat-schedule
    mem_limit: 256m

  bot:
    # Telegram-бот (docs/TELEGRAM.md). Без TELEGRAM_BOT_TOKEN выходит сразу и не перезапускается (on-failure)
    <<: *backend
    restart: on-failure
    command: python -m app.bot
    mem_limit: 256m

  frontend:
    image: ozon-analytics/frontend:${APP_VERSION:-latest}
    build:
      context: ./frontend
      dockerfile: ../docker/frontend/Dockerfile.prod
      args:
        APP_VERSION: "${APP_VERSION:-latest}"
        NEXT_PUBLIC_SENTRY_DSN: "${SENTRY_DSN:-}"
    restart: unless-stopped
    # секреты .env.prod фронтенду не нужны — только адрес API внутри сети Docker
    environment:
      API_URL: http://api:8000
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://127.0.0.1:3000/login || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    mem_limit: 512m
    logging: *logging

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN}
      NGINX_ENVSUBST_FILTER: "^DOMAIN$$"  # в шаблон подставляется только DOMAIN
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/templates:/etc/nginx/templates:ro
      - ./docker/nginx/reload-certs.sh:/docker-entrypoint.d/99-reload-certs.sh:ro
      - letsencrypt:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on: [frontend, api]
    mem_limit: 128m
    logging: *logging

  certbot:
    # продление сертификата Let's Encrypt: проверка дважды в сутки, продлевает за 30 дней до конца; первый выпуск —
    # scripts/setup.sh
    image: certbot/certbot:v5.8.0
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c", "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"]
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    mem_limit: 128m
    logging: *logging

  backup:
    # резервные копии БД в Object Storage и проверка восстановления (docker/backup, README-DEPLOY.md)
    image: ozon-analytics/backup:${APP_VERSION:-latest}
    build: ./docker/backup
    restart: unless-stopped
    env_file: .env.prod
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
    volumes: [backups:/backups]
    depends_on:
      db: { condition: service_healthy }
    mem_limit: 512m
    logging: *logging

volumes:
  postgres_data:
  redis_data:
  letsencrypt:
  certbot_www:
  backups:
