services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      retries: 5
  redis:
    image: redis:7-alpine
    restart: unless-stopped
  api:
    build: { context: ./backend, dockerfile: ../docker/backend/Dockerfile.prod }
    restart: unless-stopped
    env_file: .env.prod
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2"
  worker:
    build: { context: ./backend, dockerfile: ../docker/backend/Dockerfile.prod }
    restart: unless-stopped
    env_file: .env.prod
    depends_on: [db, redis]
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=4
  beat:
    # расписание фоновых задач; ровно один экземпляр
    build: { context: ./backend, dockerfile: ../docker/backend/Dockerfile.prod }
    restart: unless-stopped
    env_file: .env.prod
    depends_on: [redis]
    command: celery -A app.tasks.celery_app beat --loglevel=info --schedule /tmp/celerybeat-schedule
  frontend:
    build: { context: ./frontend, dockerfile: ../docker/frontend/Dockerfile.prod }
    restart: unless-stopped
    env_file: .env.prod
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on: [api, frontend]
volumes:
  postgres_data:
